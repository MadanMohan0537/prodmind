name: ProdMind connected lifecycle
on:
  push:
    paths:
      - 'experiment-data-quality-auditor/**'
      - '.github/workflows/experiment-data-quality-auditor.yml'
      - 'feedback_collector/**'
      - 'sentiment_analyzer/**'
      - 'topic_modeler/**'
      - 'feature_request_detector/**'
      - 'voice_of_customer_dashboard/**'
      - 'prioritization_engine/**'
      - 'product_outcome_monitor/**'
      - 'product_learning_memory/**'
      - 'decision_calibration_engine/**'
      - 'evidence_integrity_monitor/**'
  pull_request:
    paths:
      - 'experiment-data-quality-auditor/**'
      - '.github/workflows/experiment-data-quality-auditor.yml'
      - 'feedback_collector/**'
      - 'sentiment_analyzer/**'
      - 'topic_modeler/**'
      - 'feature_request_detector/**'
      - 'voice_of_customer_dashboard/**'
      - 'prioritization_engine/**'
      - 'product_outcome_monitor/**'
      - 'product_learning_memory/**'
      - 'decision_calibration_engine/**'
      - 'evidence_integrity_monitor/**'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node experiment-data-quality-auditor/scripts/test-all.mjs
      - run: node --check experiment-data-quality-auditor/public/app.js
