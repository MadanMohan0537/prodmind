name: Experiment Data Quality Auditor
on:
  push:
    paths:
      - 'experiment-data-quality-auditor/**'
      - '.github/workflows/experiment-data-quality-auditor.yml'
  pull_request:
    paths:
      - 'experiment-data-quality-auditor/**'
      - '.github/workflows/experiment-data-quality-auditor.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: experiment-data-quality-auditor
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test
      - run: node src/cli.js examples/clean.json
