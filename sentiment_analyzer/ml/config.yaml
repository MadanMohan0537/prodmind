model_name: FacebookAI/xlm-roberta-base
labels: [negative, neutral, positive]
max_length: 256
seed: 42
training:
  epochs: 3
  learning_rate: 0.0002
  train_batch_size: 8
  eval_batch_size: 16
  gradient_accumulation_steps: 2
  weight_decay: 0.01
  warmup_ratio: 0.1
lora:
  rank: 8
  alpha: 16
  dropout: 0.1
  target_modules: [query, value]
uncertainty:
  mc_passes: 20
  review_entropy_threshold: 0.85
