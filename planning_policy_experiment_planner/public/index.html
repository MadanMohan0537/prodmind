<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <title>Planning policy experiments | ProdMind</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <main>
      <header>
        <p class="eyebrow">PRODMIND / PROJECT 32</p>
        <h1>Test planning changes before making them policy.</h1>
        <p class="lede">Convert failed Project 31 calibration checks into reversible, owned policy experiments that fit available change capacity and retain a named human decision.</p>
      </header>
      <section class="panel" aria-labelledby="planner-heading">
        <h2 id="planner-heading">Plan policy experiments</h2>
        <label>API token<input id="token" type="password" autocomplete="off"></label>
        <label>Request JSON<textarea id="payload" spellcheck="false"></textarea></label>
        <div class="actions">
          <button id="sample" class="secondary" type="button">Load example</button>
          <button id="run" type="button">Optimize experiment plan</button>
        </div>
        <p id="message" role="status" aria-live="polite"></p>
      </section>
      <section id="result" aria-live="polite"></section>
    </main>
    <script type="module" src="/app.js"></script>
  </body>
</html>
