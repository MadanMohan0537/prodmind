<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ProdMind Product Learning Memory</title><meta name="description" content="Search evidence-linked product decisions and monitored outcomes."><link rel="stylesheet" href="/styles.css"><script type="module" src="/app.js"></script></head><body><main><header><p class="eyebrow">PRODMIND · PROJECT 9</p><h1>Product Learning Memory</h1><p>Find prior evidence, experiments, decisions, and monitored outcomes before committing to the next product bet.</p></header><section><label>API token<input id="token" type="password" autocomplete="off"></label><label>Product runs JSON<input id="file" type="file" accept=".json,application/json"></label><label>Search prior learning<input id="query" placeholder="onboarding activation"></label><div class="filters"><label>Decision<select id="outcome"><option value="">Any</option><option>ship</option><option>iterate</option><option>reject</option></select></label><label>Outcome status<select id="status"><option value="">Any</option><option>sustained</option><option>emerging</option><option>below_target</option><option>at_risk</option><option>unmonitored</option></select></label></div><button id="search">Search learning</button><p id="notice" role="status"></p></section><section id="results"><p>Upload an export containing complete ProdMind runs or use Project 9 through the connected workspace.</p></section></main></body></html>
